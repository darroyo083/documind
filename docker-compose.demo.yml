name: documind-public-demo

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PUBLIC_DEMO_MODE: ${PUBLIC_DEMO_MODE:-true}
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY before starting the demo stack}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      # No AI/provider credentials are intentionally passed to this service.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_DEMO_MODE: ${PUBLIC_DEMO_MODE:-true}
        VITE_DEMO_VIDEO_SRC: ${DEMO_VIDEO_SRC:-}
        VITE_DEMO_VIDEO_POSTER: ${DEMO_VIDEO_POSTER:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${DEMO_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
