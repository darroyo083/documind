<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DocuMind - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#1a1c1c",
                        "surface-tint": "#5b5e66",
                        "tertiary": "#000000",
                        "surface": "#f9f9f8",
                        "surface-container-low": "#f3f4f3",
                        "charcoal-ink": "#0D1117",
                        "on-error": "#ffffff",
                        "on-secondary-container": "#dfe3ff",
                        "tertiary-fixed-dim": "#d6c3b7",
                        "surface-container-high": "#e8e8e7",
                        "surface-container-highest": "#e2e2e2",
                        "on-primary-container": "#80848c",
                        "inverse-on-surface": "#f1f1f0",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-bright": "#f9f9f8",
                        "on-surface-variant": "#45474b",
                        "on-tertiary-fixed": "#231a12",
                        "technical-blue": "#0052FF",
                        "border-muted": "#D1D5DB",
                        "secondary-container": "#0052fe",
                        "error": "#ba1a1a",
                        "archival-paper": "#F9F9F8",
                        "primary-fixed-dim": "#c3c6cf",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#dde1ff",
                        "inverse-surface": "#2f3130",
                        "tertiary-fixed": "#f3dfd2",
                        "on-secondary-fixed-variant": "#0038b6",
                        "primary": "#000000",
                        "on-primary-fixed": "#181c22",
                        "on-tertiary-container": "#918176",
                        "outline": "#76777b",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#b7c4ff",
                        "on-primary": "#ffffff",
                        "background": "#f9f9f8",
                        "primary-fixed": "#dfe2eb",
                        "on-tertiary-fixed-variant": "#51443b",
                        "surface-variant": "#e2e2e2",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#43474e",
                        "surface-container": "#eeeeed",
                        "on-surface": "#1a1c1c",
                        "primary-container": "#181c22",
                        "on-secondary-fixed": "#001452",
                        "outline-variant": "#c6c6cb",
                        "surface-dim": "#dadad9",
                        "tertiary-container": "#231a12",
                        "inverse-primary": "#c3c6cf",
                        "secondary": "#003ec6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "margin": "32px",
                        "sidebar-width": "280px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "label-mono": ["JetBrains Mono"],
                        "headline-md": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-xl": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-mono": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-archival-paper h-full flex items-center justify-center p-gutter antialiased">
<!-- Auth Container -->
<main class="w-full max-w-md bg-surface-container-lowest border border-charcoal-ink p-margin">
<!-- Header -->
<header class="mb-8 text-center">
<h1 class="font-headline-xl text-headline-xl text-charcoal-ink mb-2 tracking-tight">DocuMind</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Intelligence Workspace</p>
</header>
<!-- Login Form -->
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-charcoal-ink uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full bg-transparent border border-charcoal-ink focus:border-technical-blue focus:ring-1 focus:ring-technical-blue py-3 pl-10 pr-3 font-body-md text-body-md text-charcoal-ink transition-colors outline-none rounded-none placeholder:text-outline-variant" id="email" name="email" placeholder="archivist@domain.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-baseline">
<label class="block font-label-caps text-label-caps text-charcoal-ink uppercase tracking-wider" for="password">Password</label>
<a class="font-label-mono text-label-mono text-on-surface-variant hover:text-technical-blue transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-transparent border border-charcoal-ink focus:border-technical-blue focus:ring-1 focus:ring-technical-blue py-3 pl-10 pr-3 font-body-md text-body-md text-charcoal-ink transition-colors outline-none rounded-none placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-technical-blue hover:bg-charcoal-ink text-white font-label-caps text-label-caps uppercase tracking-wider py-4 border border-transparent hover:border-charcoal-ink transition-all duration-200 outline-none focus:ring-2 focus:ring-technical-blue focus:ring-offset-2 focus:ring-offset-archival-paper" type="submit">
                Sign In
            </button>
</form>
<!-- Footer Links -->
<div class="mt-8 pt-6 border-t border-charcoal-ink/20 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                New to DocuMind? 
                <a class="font-body-sm text-body-sm text-technical-blue hover:text-charcoal-ink transition-colors ml-1 font-semibold" href="#">Create Account</a>
</p>
</div>
</main>
<!-- Decorative background elements to reinforce the grid/architectural feel -->
<div class="fixed inset-0 pointer-events-none -z-10 opacity-[0.03]">
<div class="absolute left-1/4 top-0 bottom-0 w-px bg-charcoal-ink"></div>
<div class="absolute left-2/4 top-0 bottom-0 w-px bg-charcoal-ink"></div>
<div class="absolute left-3/4 top-0 bottom-0 w-px bg-charcoal-ink"></div>
<div class="absolute top-1/3 left-0 right-0 h-px bg-charcoal-ink"></div>
<div class="absolute top-2/3 left-0 right-0 h-px bg-charcoal-ink"></div>
</div>
</body></html>
